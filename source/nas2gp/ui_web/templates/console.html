{% extends "base.html" %}
{% block content %}
  <section class="card">
    <h2>📜 {{ tr('web.console.title') }} <span id="log-conn" class="small"></span></h2>
    <div class="btns" style="margin-bottom:10px">
      <button class="ghost" onclick="reloadLogs()">{{ tr('web.console.refresh') }}</button>
      <button class="ghost" onclick="clearLogs()">{{ tr('web.console.clear') }}</button>
      <span class="small" style="align-self:center">{{ tr('web.console.hint') }}</span>
    </div>
    <div class="log" id="log" style="max-height: 72vh;"></div>
  </section>
{% endblock %}

{% block scripts %}
<script>
let _logPaused = false;
async function reloadLogs(){
  try {
    const l = await fetch('/api/logs?limit=300').then(r=>r.json());
    if (!_logPaused) renderLogs('log', l.logs||[]);
  } catch(e) { console.warn(e); }
}
function clearLogs(){ $('log').innerHTML=''; }
function updateConn(txt, color){
  const el = $('log-conn'); if (!el) return;
  el.textContent = txt; el.style.color = color || '';
}
(function sse(){
  updateConn(t('web.console.connecting'), 'var(--sub)');
  const es = new EventSource('/api/logs/sse');
  es.addEventListener('open', ()=>updateConn(t('web.console.live'), 'var(--ok)'));
  es.addEventListener('error', ()=>{
    updateConn(t('web.console.polling'), 'var(--warn)');
    es.close(); setInterval(reloadLogs, 2000);
  });
  es.addEventListener('message', (e)=>{
    try { const d = JSON.parse(e.data); if (!_logPaused) renderLogs('log', d.logs||[]); } catch(_){}
  });
})();
reloadLogs();
</script>
{% endblock %}
